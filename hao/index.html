<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘉豪之家</title>
<style>
  :root{
    --bg:#07070b;
    --ink:#e9e9f2;
    --dim:#8a8aa3;
    --neon:#7b5cff;
    --neon2:#28e0d0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(123,92,255,.25), transparent 55%),
      radial-gradient(ellipse at 90% 20%, rgba(40,224,208,.12), transparent 45%),
      linear-gradient(#07070b,#0b0b12 60%,#07070b);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* 扫描线 */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 18px;position:relative;z-index:2;}

  /* 顶部 */
  header{padding:64px 0 26px;text-align:center;position:relative;}
  .mask{
    width:96px;height:96px;margin:0 auto 16px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#2a2a38,#0d0d12 70%);
    border:2px solid rgba(123,92,255,.55);
    box-shadow:0 0 34px rgba(123,92,255,.45),inset 0 0 28px rgba(0,0,0,.9);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;
    animation:hover 3.6s ease-in-out infinite;
  }
  @keyframes hover{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}

  h1{
    font-size:clamp(38px,11vw,84px);letter-spacing:12px;font-weight:800;
    position:relative;display:inline-block;
    background:linear-gradient(120deg,#fff 10%,#b9a8ff 40%,#fff 60%,#8ef7ef 85%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:flow 6s linear infinite;
  }
  @keyframes flow{to{background-position:220% center;}}
  h1::before,h1::after{
    content:attr(data-t);position:absolute;left:0;top:0;width:100%;
    background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:.55;
  }
  h1::before{transform:translate(-2px,0);filter:hue-rotate(-40deg);animation:g1 4s steps(2) infinite;}
  h1::after{transform:translate(2px,0);filter:hue-rotate(50deg);animation:g2 3s steps(2) infinite;}
  @keyframes g1{0%,90%{opacity:0;}92%,100%{opacity:.5;}}
  @keyframes g2{0%,88%{opacity:0;}90%,100%{opacity:.45;}}

  .sub{margin-top:8px;color:var(--dim);letter-spacing:6px;font-size:13px;}

  /* 豪意值 */
  .meter{
    margin:30px auto 0;max-width:620px;
    background:rgba(255,255,255,.04);border:1px solid rgba(123,92,255,.3);
    border-radius:16px;padding:16px 18px;backdrop-filter:blur(6px);
  }
  .meter .top{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);letter-spacing:2px;}
  .meter .top b{color:#c9bcff;font-size:15px;}
  .bar{height:12px;border-radius:99px;background:#15151f;margin-top:10px;overflow:hidden;border:1px solid #23233a;}
  .fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#4b3bd6,#7b5cff 40%,#28e0d0);
    box-shadow:0 0 18px rgba(123,92,255,.7);
    transition:width .5s cubic-bezier(.2,.9,.2,1);
  }
  .rank{margin-top:10px;text-align:center;font-size:14px;letter-spacing:4px;color:#8ef7ef;min-height:20px;}

  /* 按钮区 */
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:26px 0 8px;}
  button{
    font-family:inherit;cursor:pointer;
    padding:12px 22px;border-radius:12px;font-size:15px;letter-spacing:2px;
    color:#e8e3ff;background:rgba(123,92,255,.10);
    border:1px solid rgba(123,92,255,.45);
    transition:.18s ease;
  }
  button:hover{background:rgba(123,92,255,.22);box-shadow:0 0 22px rgba(123,92,255,.35);transform:translateY(-2px);}
  button:active{transform:scale(.96);}

  /* 卡片 */
  .grid{
    display:grid;gap:16px;margin:34px 0 10px;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  }
  .card{
    padding:22px 18px;border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.08);
    transition:.22s ease;position:relative;overflow:hidden;
  }
  .card:hover{border-color:rgba(123,92,255,.55);transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.55);}
  .card h3{font-size:17px;letter-spacing:3px;margin-bottom:10px;color:#d9d2ff;}
  .card p{font-size:13px;line-height:1.95;color:#a9a9c0;}
  .card .tag{
    display:inline-block;margin-top:12px;font-size:11px;letter-spacing:2px;
    padding:3px 9px;border-radius:99px;color:#8ef7ef;
    border:1px solid rgba(40,224,208,.4);background:rgba(40,224,208,.08);
  }

  /* 语录 */
  .quotes{margin:26px 0 10px;display:grid;gap:10px;}
  .quote{
    padding:14px 16px;border-left:3px solid rgba(123,92,255,.7);
    background:rgba(123,92,255,.06);border-radius:0 10px 10px 0;
    font-size:14px;color:#c9c9dc;letter-spacing:1px;
  }
  .quote span{display:block;margin-top:6px;font-size:11px;color:#6f6f8c;letter-spacing:2px;}

  footer{padding:40px 0 60px;text-align:center;font-size:12px;color:#5f5f78;letter-spacing:2px;}

  /* 特效层 */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
  .drop{
    position:absolute;top:-10vh;width:2px;height:18px;border-radius:2px;
    background:linear-gradient(transparent,#8fd8ff);opacity:.55;
    animation:fall linear forwards;
  }
  @keyframes fall{to{transform:translateY(120vh);opacity:0;}}
  .bit{
    position:absolute;font-size:22px;font-weight:800;
    animation:fly .9s ease-out forwards;pointer-events:none;
  }
  @keyframes fly{
    0%{transform:translate(0,0) scale(.6);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0;}
  }
  .ring{
    position:absolute;border-radius:50%;border:2px solid rgba(123,92,255,.8);
    animation:ring .7s ease-out forwards;pointer-events:none;
  }
  @keyframes ring{0%{transform:scale(.2);opacity:.9;}100%{transform:scale(2.4);opacity:0;}}
</style>
</head>
<body>
<div class="fx" id="fx"></div>

<div class="wrap">
  <header>
    <div class="mask">🎧</div>
    <h1 data-t="嘉豪之家">嘉豪之家</h1>
    <div class="sub">黑 卫 衣 · 黑 口 罩 · 虚 空 打 碟</div>

    <div class="meter">
      <div class="top"><span>豪意值</span><b id="val">0</b></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="rank" id="rank">普通的嘉豪</div>
    </div>

    <div class="actions">
      <button data-act="disc">虚空打碟</button>
      <button data-act="rain">雨中漫步</button>
      <button data-act="all">全对！</button>
      <button data-act="haole">豪到你了</button>
      <button data-act="reset">清零</button>
    </div>
  </header>

  <section class="grid">
    <article class="card">
      <h3>三件套</h3>
      <p>黑色连帽卫衣 · 黑色口罩 · 头戴耳机<br>缺一件都不算完整</p>
      <div class="tag">基础装备</div>
    </article>
    <article class="card">
      <h3>名场面</h3>
      <p>教室里的虚空打碟<br>雨中的慢动作走路<br>对答案时那声全对</p>
      <div class="tag">经典复刻</div>
    </article>
    <article class="card">
      <h3>豪意值</h3>
      <p>越低越像普通人<br>越高越接近自在极意豪</p>
      <div class="tag">核心指标</div>
    </article>
  </section>

  <section class="quotes">
    <div class="quote">“全对！ABCD，CBBD，全对！Nice！”<span>—— 课堂上的嘉豪</span></div>
    <div class="quote">“豪到你了？”<span>—— 被质疑时的标准回应</span></div>
    <div class="quote">“你听说过嘉豪吗？”<span>—— 2026</span></div>
  </section>

  <footer>
    嘉豪之家 · 仅供一乐 · 请勿对号入座<br>
    真正的嘉豪，从不在意别人怎么看
  </footer>
</div>

<script>
(function () {
  var fx = document.getElementById('fx');
  var fill = document.getElementById('fill');
  var valEl = document.getElementById('val');
  var rankEl = document.getElementById('rank');
  var score = 0;

  var RANKS = [
    [0,   '普通的嘉豪'],
    [20,  '入门嘉豪'],
    [40,  '进阶嘉豪'],
    [60,  '资深嘉豪'],
    [80,  '嘉豪宗师'],
    [100, '自在极意豪']
  ];

  function rankOf(s) {
    var r = RANKS[0][1];
    for (var i = 0; i < RANKS.length; i++) if (s >= RANKS[i][0]) r = RANKS[i][1];
    return r;
  }

  function setScore(s) {
    score = Math.max(0, Math.min(100, s));
    fill.style.width = score + '%';
    valEl.textContent = score;
    rankEl.textContent = rankOf(score);
  }

  function burst(x, y, items, n) {
    for (var i = 0; i < n; i++) {
      var b = document.createElement('div');
      b.className = 'bit';
      b.textContent = items[Math.floor(Math.random() * items.length)];
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      b.style.setProperty('--dx', (Math.random() * 260 - 130) + 'px');
      b.style.setProperty('--dy', (-Math.random() * 220 - 40) + 'px');
      fx.appendChild(b);
      setTimeout(function (node) { return function () { node.remove(); }; }(b), 950);
    }
  }

  function ripple(x, y) {
    var r = document.createElement('div');
    r.className = 'ring';
    r.style.left = (x - 30) + 'px';
    r.style.top = (y - 30) + 'px';
    r.style.width = '60px';
    r.style.height = '60px';
    fx.appendChild(r);
    setTimeout(function () { r.remove(); }, 750);
  }

  function rain() {
    for (var i = 0; i < 26; i++) {
      var d = document.createElement('div');
      d.className = 'drop';
      d.style.left = (Math.random() * 100) + 'vw';
      d.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      d.style.animationDelay = (Math.random() * 0.5) + 's';
      fx.appendChild(d);
      setTimeout(function (node) { return function () { node.remove(); }; }(d), 2200);
    }
  }

  document.querySelectorAll('button[data-act]').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      var act = btn.getAttribute('data-act');
      ripple(e.clientX, e.clientY);
      if (act === 'disc') {
        burst(e.clientX, e.clientY, ['🎵', '🎶', '💿', '🎧'], 14);
        setScore(score + 8);
      } else if (act === 'rain') {
        rain();
        setScore(score + 10);
      } else if (act === 'all') {
        burst(e.clientX, e.clientY, ['✅', '全对', 'A', 'B', 'C', 'D'], 18);
        setScore(score + 12);
      } else if (act === 'haole') {
        burst(e.clientX, e.clientY, ['豪', '帅', '装', '？'], 16);
        setScore(score + 15);
      } else if (act === 'reset') {
        setScore(0);
      }
    });
  });

  setScore(0);
})();
</script>
</body>
</html>
