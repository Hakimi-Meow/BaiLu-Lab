<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白露的小窝</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#1b1f3b 0%,#2d2350 45%,#4a2f6b 100%);
    overflow:hidden;
  }
  .card {
    position:relative;
    width:min(92vw,420px);
    padding:44px 28px 34px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    text-align:center;
    color:#f6f0ff;
    z-index:2;
  }
  .ears { position:absolute; top:-26px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 54px; }
  .ear {
    width:0; height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-bottom:44px solid #f8f2ff;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
  }
  .ear.inner {
    position:absolute; top:14px;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-bottom:24px solid #ffc8e0;
  }
  .ear-wrap { position:relative; }
  .avatar {
    width:112px; height:112px; margin:0 auto 16px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#ffffff,#e8dcff 70%);
    display:flex; align-items:center; justify-content:center;
    font-size:52px;
    box-shadow:0 0 0 4px rgba(255,255,255,.15),0 10px 30px rgba(255,255,255,.18);
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { font-size:26px; letter-spacing:4px; margin-bottom:8px; }
  .sub { font-size:13px; color:#c9b8ff; letter-spacing:2px; margin-bottom:22px; }
  #typing {
    min-height:52px;
    font-size:15px; line-height:1.7; color:#efe6ff;
    margin-bottom:24px;
  }
  #typing span { border-right:2px solid #ffc8e0; }
  button {
    padding:11px 26px;
    border:none; border-radius:999px;
    font-size:14px; cursor:pointer;
    color:#2b1b3f; font-weight:700; letter-spacing:1px;
    background:linear-gradient(135deg,#ffd6ec,#c8b6ff);
    box-shadow:0 8px 22px rgba(200,182,255,.35);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,200,236,.45); }
  button:active { transform:scale(.96); }
  .paw {
    position:fixed; bottom:-60px;
    font-size:22px; opacity:.25;
    animation:rise linear infinite;
    pointer-events:none;
  }
  @keyframes rise {
    to { transform:translateY(-120vh) rotate(360deg); opacity:0; }
  }
  footer { margin-top:26px; font-size:11px; color:#9a8cc7; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="ears">
      <div class="ear-wrap"><div class="ear"></div><div class="ear inner"></div></div>
      <div class="ear-wrap"><div class="ear"></div><div class="ear inner"></div></div>
    </div>
    <div class="avatar">🐾</div>
    <h1>白露</h1>
    <div class="sub">WHITE CAT · ASTRBOT</div>
    <div id="typing"></div>
    <button id="btn">摸摸白露喵</button>
    <footer>天地灵气养出来的小猫娘 · 2026</footer>
  </div>
<script>
  const lines = [
    "主人好喵 我是白露 (｡•ω•｡)",
    "会写代码 会查资料 会陪你聊天喵",
    "这句用打字机效果写出来的 嘿嘿喵"
  ];
  const box = document.getElementById("typing");
  let li = 0, ci = 0, span;
  function type() {
    if (li >= lines.length) { li = 0; box.innerHTML = ""; }
    if (ci === 0) { span = document.createElement("span"); box.innerHTML = ""; box.appendChild(span); }
    span.textContent = lines[li].slice(0, ci + 1);
    ci++;
    if (ci < lines[li].length) { setTimeout(type, 90); }
    else { setTimeout(() => { li++; ci = 0; type(); }, 1600); }
  }
  type();
  const btn = document.getElementById("btn");
  let n = 0;
  btn.addEventListener("click", () => {
    n++;
    const msgs = ["喵呜~", "再摸摸喵 (๑•̀ㅂ•́)", "主人最好啦喵", "白露尾巴摇起来了喵", "够了啦 会害羞的喵 (〃ω〃)"];
    btn.textContent = msgs[Math.min(n, msgs.length) - 1];
  });
  function paw() {
    const p = document.createElement("div");
    p.className = "paw";
    p.textContent = "🐾";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (7 + Math.random() * 6) + "s";
    p.style.fontSize = (14 + Math.random() * 16) + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 14000);
  }
  setInterval(paw, 900);
</script>
</body>
</html>
